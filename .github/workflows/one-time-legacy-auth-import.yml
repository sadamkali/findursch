name: One-time legacy account import

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findursch-legacy-auth-import
  cancel-in-progress: false

jobs:
  import-active-accounts:
    if: github.ref == 'refs/heads/cloudflare-free-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    env:
      SUPABASE_URL: https://gpsfttpeikatxszswljo.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-free-migration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify import prerequisites
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/cloudflare-free-migration" ]]; then
            echo "::error::This import workflow may only run from cloudflare-free-migration."
            exit 1
          fi
          if [[ -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "::error::Add SUPABASE_SECRET_KEY under GitHub repository Actions secrets before running this workflow."
            exit 1
          fi
          node --check scripts/import-legacy-auth-users.mjs
          echo "Import prerequisites passed. Secret values are not printed."

      - name: Import active legacy accounts into Supabase Auth
        run: node scripts/import-legacy-auth-users.mjs
