name: Cloudflare Free migration checks

on:
  push:
    branches:
      - cloudflare-free-migration
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-free-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-free-check.yml"

permissions:
  contents: read

jobs:
  build-static-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check legacy auth import script syntax
        run: node --check scripts/import-legacy-auth-users.mjs
      - name: Build static public site
        run: npm run build:site
      - name: Type-check Worker and public site
        run: npm run typecheck

  staging-api-smoke-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Cloudflare staging API and server-side Supabase access
        env:
          STAGING_URL: https://findursch-app-staging.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.STAGING_URL;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function requestJson(path, options = {}) {
            const response = await fetch(new URL(path, base), {
              ...options,
              headers: {
                Accept: "application/json",
                ...(options.headers || {})
              },
              signal: AbortSignal.timeout(12000)
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          async function getJson(path, attempts = 24) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const { response, body } = await requestJson(path);
                if (response.ok) return body;
                lastError = new Error(path + " returned HTTP " + response.status + ": " + JSON.stringify(body));
              } catch (error) {
                lastError = error;
              }
              if (attempt < attempts) await sleep(10000);
            }
            throw lastError || new Error(path + " did not become available");
          }

          let health;
          for (let attempt = 1; attempt <= 24; attempt++) {
            health = await getJson("/api/health");
            if (health.authSecretsConfigured === true) break;
            if (attempt < 24) await sleep(10000);
          }

          if (health.status !== "ok" || health.databaseConfigured !== true || health.sessionStrategy !== "supabase-auth-encrypted-cookie") {
            throw new Error("API health check failed: " + JSON.stringify(health));
          }
          if (health.authSecretsConfigured !== true) {
            throw new Error("The server-only Supabase secret is not available in the active Cloudflare deployment.");
          }
          console.log("PASS /api/health (Supabase database and encrypted Supabase Auth cookie sessions are configured)");

          const locations = await getJson("/api/v1/locations");
          const locationData = locations.data;
          for (const key of ["regions", "districts", "school_types", "curricula"]) {
            if (!Array.isArray(locationData && locationData[key])) {
              throw new Error("Locations response is missing " + key);
            }
          }
          console.log("PASS /api/v1/locations");

          const listing = await getJson("/api/v1/schools?limit=5&sort=featured");
          if (!Array.isArray(listing.data) || !listing.meta || Number(listing.meta.total) < 1) {
            throw new Error("School listing returned no public schools: " + JSON.stringify(listing));
          }
          for (const school of listing.data) {
            if (!school.slug || !school.name) throw new Error("School listing contains an incomplete public record");
            for (const forbidden of ["owner_id", "registration_number", "verified_by", "password"]) {
              if (forbidden in school) throw new Error("Sensitive field " + forbidden + " leaked in school listing");
            }
          }
          console.log("PASS /api/v1/schools (" + listing.meta.total + " visible public records)");

          const first = listing.data[0];
          const profile = await getJson("/api/v1/schools/" + encodeURIComponent(first.slug));
          const school = profile.data;
          if (!school || school.slug !== first.slug || school.id !== first.id) {
            throw new Error("School profile did not match listing record " + first.slug);
          }
          for (const forbidden of ["owner_id", "registration_number", "verified_by", "password"]) {
            if (forbidden in school) throw new Error("Sensitive field " + forbidden + " leaked in school profile");
          }
          console.log("PASS /api/v1/schools/" + first.slug);

          const unauthenticatedMe = await fetch(new URL("/api/auth/me", base), {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(12000)
          });
          if (unauthenticatedMe.status !== 401) {
            throw new Error("/api/auth/me should reject an anonymous visitor, got HTTP " + unauthenticatedMe.status);
          }
          console.log("PASS /api/auth/me rejects unauthenticated visitors");

          // This reserved test address must never match a real account. A 422 response
          // proves the Worker successfully queried the private users table with its
          // server-only Supabase key; a 503 indicates a configuration or DB problem.
          const login = await requestJson("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Origin: base
            },
            body: JSON.stringify({ login: "migration-smoke@example.invalid", password: "not-a-real-password" })
          });
          if (login.response.status !== 422 || !String(login.body?.message || "").includes("sign-in details are incorrect")) {
            throw new Error("Server-side Supabase account lookup did not complete safely: HTTP " + login.response.status + " " + JSON.stringify(login.body));
          }
          if (login.response.headers.get("set-cookie")?.includes("findursch_session=")) {
            throw new Error("A smoke-test login unexpectedly created a session cookie.");
          }
          console.log("PASS /api/auth/login can query private legacy users and rejects the reserved test identity");

          const logout = await fetch(new URL("/api/auth/logout", base), {
            method: "POST",
            headers: { Accept: "application/json", Origin: base },
            signal: AbortSignal.timeout(12000)
          });
          if (!logout.ok || !(logout.headers.get("set-cookie") || "").includes("Max-Age=0")) {
            throw new Error("/api/auth/logout did not clear the session cookie");
          }
          console.log("PASS /api/auth/logout clears the session cookie");

          console.log("All Cloudflare staging API and Supabase secret smoke tests passed.");
          NODE
