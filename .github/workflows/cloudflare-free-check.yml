name: Cloudflare Free migration checks

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-free-migration
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-free-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-free-check.yml"

permissions:
  contents: read

jobs:
  build-static-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check legacy auth import script syntax
        run: node --check scripts/import-legacy-auth-users.mjs
      - name: Build Cloudflare public site
        run: npm run build:site
      - name: Type-check Worker and public site
        run: npm run typecheck

  deployed-public-site-smoke-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed public website and anonymous Supabase API
        env:
          WORKER_URL: https://findursch.propipspath.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;

          async function request(path) {
            const response = await fetch(new URL(path, base), {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(15000)
            });
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            return { response, body, text };
          }

          async function getJson(path) {
            const result = await request(path);
            if (!result.response.ok) {
              throw new Error(path + " returned HTTP " + result.response.status + ": " + result.text.slice(0, 500));
            }
            if (!result.body || typeof result.body !== "object") {
              throw new Error(path + " did not return JSON");
            }
            return result.body;
          }

          const revision = '<meta name="findursch-build-revision" content="findursch-public-site-2026-11-27-v1" />';
          let home = null;
          for (let attempt = 1; attempt <= 36; attempt++) {
            home = await request("/");
            if (home.response.ok && home.response.headers.get("content-type")?.includes("text/html") && home.text.includes(revision)) break;
            if (attempt === 36) throw new Error("Cloudflare Worker did not serve the expected Git build revision after 180 seconds. Last response: HTTP " + home.response.status);
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!home.response.ok || !home.response.headers.get("content-type")?.includes("text/html")) {
            throw new Error("Homepage did not return an HTML document: HTTP " + home.response.status);
          }
          for (const marker of ["site-header", "site-footer", "FindURSCH"]) {
            if (!home.text.includes(marker)) throw new Error("Homepage HTML is missing " + marker);
          }
          console.log("PASS public homepage HTML and shared site shell");

          const css = await fetch(new URL("/css/home-reference.css", base), { signal: AbortSignal.timeout(15000) });
          if (!css.ok) throw new Error("The FindURSCH homepage reference stylesheet is not served (HTTP " + css.status + ")");
          console.log("PASS original FindURSCH homepage stylesheet is served");

          const health = await getJson("/api/health");
          if (health.status !== "ok" || health.databaseConfigured !== true) {
            throw new Error("Public API health check failed: " + JSON.stringify(health));
          }
          console.log("PASS /api/health (public Supabase API is configured)");

          const locations = await getJson("/api/v1/locations");
          for (const key of ["regions", "districts", "school_types", "curricula"]) {
            if (!Array.isArray(locations.data?.[key])) throw new Error("Locations response is missing " + key);
          }
          console.log("PASS /api/v1/locations");

          const listing = await getJson("/api/v1/schools?limit=5&sort=featured");
          if (!Array.isArray(listing.data) || !listing.meta || Number(listing.meta.total) < 1) {
            throw new Error("School listing returned no public schools: " + JSON.stringify(listing));
          }
          for (const school of listing.data) {
            for (const forbidden of ["owner_id", "registration_number", "verified_by", "password", "application_fee", "fees", "school_fees"]) {
              if (Object.hasOwn(school, forbidden)) throw new Error("Sensitive field " + forbidden + " leaked in school listing");
            }
          }
          console.log("PASS /api/v1/schools (" + listing.meta.total + " visible public records)");

          const first = listing.data[0];
          const profile = await getJson("/api/v1/schools/" + encodeURIComponent(first.slug));
          const school = profile.data;
          if (!school || school.slug !== first.slug || school.id !== first.id) {
            throw new Error("School profile did not match listing record " + first.slug);
          }
          for (const forbidden of ["owner_id", "registration_number", "verified_by", "password", "application_fee", "fees", "school_fees"]) {
            if (Object.hasOwn(school, forbidden)) throw new Error("Sensitive field " + forbidden + " leaked in school profile");
          }
          console.log("PASS /api/v1/schools/:slug (estimated ranges only; no itemised fees)");

          const homepage = await getJson("/api/v1/homepage");
          const requiredArrays = ["featured_schools", "school_types", "news_articles", "insight_articles", "upcoming_events", "latest_jobs", "videos", "ads"];
          for (const key of requiredArrays) {
            if (!Array.isArray(homepage.data?.[key])) throw new Error("Homepage API is missing " + key);
          }
          if (!Number.isFinite(Number(homepage.data.scholarship_count))) {
            throw new Error("Homepage API did not return a scholarship count");
          }
          for (const school of homepage.data.featured_schools) {
            for (const forbidden of ["owner_id", "registration_number", "application_fee", "amount", "school_fees"]) {
              if (Object.hasOwn(school, forbidden)) throw new Error("Homepage featured school leaked " + forbidden);
            }
          }
          console.log("PASS /api/v1/homepage (schools, news, events, videos, scholarships, jobs and fallback adverts)");
          console.log("All public website smoke tests passed. Authentication and protected dashboard flows are tested separately.");
          NODE
