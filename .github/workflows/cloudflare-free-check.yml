name: Cloudflare Free migration checks

on:
  push:
    branches:
      - cloudflare-free-migration
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-free-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-free-check.yml"

permissions:
  contents: read

jobs:
  build-static-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static public site
        run: npm run build:site

      - name: Type-check Worker and public site
        run: npm run typecheck
